<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COcartera — Tus finanzas en tu bolsillo</title>
<!--
  CAPTURAS: guarda tus 5 imágenes en la misma carpeta con estos nombres:
    ss1.jpg  →  Dashboard / Inicio
    ss2.jpg  →  Resumen del mes
    ss3.jpg  →  Préstamos
    ss4.jpg  →  Deudas
    ss5.jpg  →  Presupuesto
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;max-width:100%}

:root{
  --teal:#14b8a6;--teal-d:#0d9488;
  --green:#10b981;--red:#ef4444;
  --bg:#04110e;
}

body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;
}

/* ── Background ── */
.bg{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 12% 50%,rgba(20,184,166,.08) 0%,transparent 70%),
    radial-gradient(ellipse 45% 40% at 88% 15%,rgba(16,185,129,.05) 0%,transparent 60%),
    radial-gradient(ellipse 40% 45% at 65% 88%,rgba(20,184,166,.04) 0%,transparent 55%),
    #04110e;
  pointer-events:none;z-index:0;
}
.bg::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(20,184,166,.06) 1px,transparent 1px);
  background-size:30px 30px;
}

/* Particles */
.pts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
@keyframes rise{
  0%  {transform:translateY(0);opacity:0}
  8%  {opacity:.9}92%{opacity:.4}
  100%{transform:translateY(-110vh);opacity:0}
}

/* ── Layout ── */
.scene{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr auto;
  align-items:center;gap:72px;
  padding:48px;max-width:1120px;width:100%;
}

/* ── Text panel ── */
.badge{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid rgba(20,184,166,.35);background:rgba(20,184,166,.08);
  border-radius:100px;padding:5px 16px 5px 8px;margin-bottom:28px;
  opacity:0;animation:slideL .7s .4s ease both;
}
.badge-dot{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(160deg,#e8e8e8 0%,#b0b0b0 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.25);
  line-height:1;padding-top:1px;
}
.badge-dot-co{font-size:13px;font-weight:900;color:#000;letter-spacing:-1px;line-height:1}
.badge-dot-usd{font-size:8px;font-weight:700;color:#000;line-height:1;margin-top:-1px}
.badge-txt{font-size:13px;color:#5eead4;font-weight:500;letter-spacing:.3px}

h1{
  font-size:clamp(48px,6vw,72px);font-weight:900;
  line-height:.95;letter-spacing:-2px;color:#fff;
  opacity:0;animation:slideL .7s .6s ease both;
}
h1 em{font-style:normal;color:var(--teal)}

.tagline{
  margin-top:14px;font-size:clamp(16px,2vw,20px);
  color:rgba(255,255,255,.42);font-weight:400;line-height:1.5;
  opacity:0;animation:slideL .7s .8s ease both;
}

/* Promo texts */
.promos{position:relative;height:70px;margin:34px 0 30px;overflow:hidden}
.promo{
  position:absolute;inset:0;display:flex;align-items:center;
  font-size:clamp(17px,2.1vw,24px);font-weight:700;color:#fff;
  line-height:1.3;opacity:0;transform:translateX(-22px);
  transition:opacity .5s ease,transform .5s ease;pointer-events:none;
}
.promo.in{opacity:1;transform:translateX(0)}
.promo.out{opacity:0;transform:translateX(22px)}

/* Dots */
.dots{
  display:flex;gap:8px;margin-bottom:34px;
  opacity:0;animation:fadeIn .6s 1.5s ease both;
}
.dot{height:6px;border-radius:3px;background:rgba(255,255,255,.18);width:6px;transition:all .4s ease}
.dot.on{background:var(--teal);width:22px}

/* Store button */
.store{opacity:0;animation:pop .5s 2s cubic-bezier(.34,1.56,.64,1) both}
.apple-btn{
  display:inline-flex;align-items:center;gap:14px;
  background:#000;border:1px solid rgba(255,255,255,.2);
  border-radius:14px;padding:11px 22px;text-decoration:none;color:#fff;
  transition:transform .2s ease,box-shadow .2s ease;
}
.apple-btn:hover{transform:scale(1.04) translateY(-2px);box-shadow:0 14px 40px rgba(20,184,166,.28)}
.apple-copy{display:flex;flex-direction:column}
.apple-sm{font-size:11px;font-weight:400;opacity:.75;letter-spacing:.2px}
.apple-lg{font-size:20px;font-weight:600;line-height:1.1}

/* ── Phone ── */
.phone-wrap{perspective:1100px;flex-shrink:0}
.phone{
  width:282px;height:582px;position:relative;
  transform-style:preserve-3d;will-change:transform;
  backface-visibility:visible;-webkit-backface-visibility:visible;
  animation:phoneEnter 1.5s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes phoneEnter{
  from{opacity:0;transform:rotateY(-72deg) rotateX(30deg) translateY(60px)}
  to  {opacity:1;transform:rotateY(-14deg) rotateX(4deg)  translateY(0)}
}

.frame{
  position:absolute;inset:0;border-radius:46px;
  background:linear-gradient(150deg,#2d2d2d 0%,#111 40%,#1c1c1c 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.13),
    inset 0 -1px 0 rgba(0,0,0,.6),
    0 0 0 .5px rgba(255,255,255,.07),
    24px 48px 96px rgba(0,0,0,.95),
    -4px -4px 20px rgba(255,255,255,.02);
  backface-visibility:visible;-webkit-backface-visibility:visible;
}
.br{position:absolute;right:-3px;width:3px;border-radius:0 2px 2px 0;background:linear-gradient(to right,#232323,#333)}
.br1{top:118px;height:56px}.br2{top:188px;height:56px}
.bl{position:absolute;left:-3px;width:3px;border-radius:2px 0 0 2px;background:linear-gradient(to left,#232323,#333)}
.bl1{top:98px;height:33px}.bl2{top:142px;height:58px}.bl3{top:212px;height:58px}

.screen-bg{
  position:absolute;top:9px;left:9px;right:9px;bottom:9px;
  border-radius:38px;background:#0a0a0a;overflow:hidden;
}
.island{
  position:absolute;top:13px;left:50%;transform:translateX(-50%);
  width:104px;height:32px;background:#000;border-radius:18px;z-index:200;
  box-shadow:0 0 0 1px rgba(255,255,255,.04);
}
.screens{position:absolute;inset:0;border-radius:38px;overflow:hidden}

/* ── Screen slides ── */
.scr{
  position:absolute;inset:0;opacity:0;
  border-radius:38px;overflow:hidden;
}
.scr img{
  width:100%;height:100%;
  object-fit:cover;object-position:top center;
  display:block;border-radius:38px;
}
/* Each screen gets a different entrance animation class */
.scr.show{opacity:1}

/* 5 different entrance animations */
@keyframes entSlideL{from{transform:translateX(-40%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes entSlideR{from{transform:translateX(40%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes entZoom  {from{transform:scale(.78);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes entSlideD{from{transform:translateY(35%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes entFlip  {from{transform:perspective(600px) rotateY(55deg);opacity:0}to{transform:perspective(600px) rotateY(0);opacity:1}}

.scr.a-l   {animation:entSlideL .5s cubic-bezier(.22,1,.36,1) both}
.scr.a-r   {animation:entSlideR .5s cubic-bezier(.22,1,.36,1) both}
.scr.a-z   {animation:entZoom   .45s cubic-bezier(.34,1.56,.64,1) both}
.scr.a-d   {animation:entSlideD .5s cubic-bezier(.22,1,.36,1) both}
.scr.a-f   {animation:entFlip   .55s cubic-bezier(.22,1,.36,1) both}

/* ── Keyframes ── */
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}

/* ── Responsive ── */
@media(max-width:820px){
  .scene{grid-template-columns:1fr;justify-items:center;gap:38px;padding:32px 24px;overflow:hidden}
  .panel{text-align:center}
  .badge{margin:0 auto 28px}
  .dots{justify-content:center}
  .store{display:flex;justify-content:center}
  .phone-wrap{order:-1;perspective:600px;overflow:hidden;border-radius:50px}
  .phone{
    width:232px;height:478px;
    animation-name:phoneEnterM;
    animation-timing-function:cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes phoneEnterM{
    from{opacity:0;transform:rotateY(-30deg) rotateX(15deg) translateY(40px)}
    to  {opacity:1;transform:rotateY(0deg)   rotateX(0deg)  translateY(0)}
  }
}
@media(max-width:400px){.phone{width:200px;height:412px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="pts" id="pts"></div>

<div class="scene">

  <!-- ── Text Panel ── -->
  <div class="panel">
    <div class="badge">
      <div class="badge-dot">
        <span class="badge-dot-co">CO</span>
        <span class="badge-dot-usd">$</span>
      </div>
      <span class="badge-txt">COcartera</span>
    </div>

    <h1>CO<em>cartera</em></h1>
    <p class="tagline">Tus finanzas personales.<br>Claras, simples, siempre contigo.</p>

    <div class="promos">
      <div class="promo in" id="p0">Controla tus finanzas en tiempo real</div>
      <div class="promo"    id="p1">Sabe exactamente cuánto gastas</div>
      <div class="promo"    id="p2">Gestiona préstamos sin estrés</div>
      <div class="promo"    id="p3">Mantén tus deudas bajo control</div>
      <div class="promo"    id="p4">Cumple tu presupuesto, mes a mes</div>
    </div>

    <div class="dots">
      <div class="dot on" id="d0"></div>
      <div class="dot"    id="d1"></div>
      <div class="dot"    id="d2"></div>
      <div class="dot"    id="d3"></div>
      <div class="dot"    id="d4"></div>
    </div>

    <div class="store">
      <a href="#" class="apple-btn">
        <svg width="32" height="32" viewBox="0 0 30 30" fill="none">
          <path d="M21.5 16.3c0-3.2 2.6-4.7 2.7-4.8-1.5-2.2-3.8-2.5-4.6-2.5-2-.2-3.8 1.2-4.8 1.2-1 0-2.5-1.1-4.1-1.1-2.1 0-4.1 1.2-5.2 3.1-2.2 3.8-.6 9.5 1.6 12.6 1 1.5 2.3 3.2 3.9 3.1 1.6-.1 2.2-.9 4.1-.9 1.9 0 2.4.9 4.1.9 1.7 0 2.8-1.6 3.9-3.1.7-1 1.3-2.1 1.7-3.3-3.7-1.4-3.3-5.5-3.3-6.2zM18.4 7.2c.9-1.1 1.5-2.6 1.3-4.2-1.3.1-2.8.9-3.7 2-1 1-1.6 2.5-1.4 4 1.4.1 2.9-.7 3.8-1.8z" fill="white"/>
        </svg>
        <div class="apple-copy">
          <span class="apple-sm">Download on the</span>
          <span class="apple-lg">App Store</span>
        </div>
      </a>
    </div>
  </div>

  <!-- ── Phone ── -->
  <div class="phone-wrap">
    <div class="phone" id="phone">
      <div class="frame">
        <div class="br br1"></div><div class="br br2"></div>
        <div class="bl bl1"></div><div class="bl bl2"></div><div class="bl bl3"></div>
      </div>
      <div class="screen-bg">
        <div class="island"></div>
        <div class="screens">

          <!-- Slide 1 — ss1.jpg -->
          <div class="scr show a-l" id="sc0">
            <img src="ss1.jpg" alt="COcartera – Inicio">
          </div>
          <!-- Slide 2 — ss2.jpg -->
          <div class="scr" id="sc1">
            <img src="ss2.jpg" alt="COcartera – Resumen del mes">
          </div>
          <!-- Slide 3 — ss3.jpg -->
          <div class="scr" id="sc2">
            <img src="ss3.jpg" alt="COcartera – Préstamos">
          </div>
          <!-- Slide 4 — ss4.jpg -->
          <div class="scr" id="sc3">
            <img src="ss4.jpg" alt="COcartera – Deudas">
          </div>
          <!-- Slide 5 — ss5.jpg -->
          <div class="scr" id="sc4">
            <img src="ss5.jpg" alt="COcartera – Presupuesto">
          </div>

        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ── Particles ──────────────────────────────────
(function(){
  const c=document.getElementById('pts');
  function spawn(){
    const el=document.createElement('div');
    const sz=Math.random()*4+1.5,dur=Math.random()*12+9,delay=Math.random()*3;
    el.style.cssText=`position:absolute;border-radius:50%;pointer-events:none;
      width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:-10px;
      background:radial-gradient(circle,rgba(20,184,166,.55),transparent);
      animation:rise ${dur}s ${delay}s linear forwards;`;
    c.appendChild(el);
    setTimeout(()=>el.remove(),(dur+delay)*1000);
  }
  for(let i=0;i<14;i++)spawn();
  setInterval(spawn,900);
})();

// ── Phone 3D (idle sway + slide transitions) ───
const phone  = document.getElementById('phone');
const isMob  = window.innerWidth<=820;
const angles = isMob
  ? [{y:0,x:0},{y:3,x:-1},{y:-2,x:1},{y:4,x:-2},{y:-3,x:1}]
  : [{y:-14,x:4},{y:12,x:-4},{y:-11,x:3},{y:13,x:-5},{y:-10,x:3}];
const swayAmp = isMob ? 1.5 : 5;

let tY=angles[0].y,tX=angles[0].x,cY=angles[0].y,cX=angles[0].x;
let fY=angles[0].y,fX=angles[0].x;
let trans=false,tStart=null,idleT=0,last=null,jsRunning=false;
const TDUR=950;

function lerp(a,b,t){return a+(b-a)*t}
function easeOutElastic(t){
  if(t<=0)return 0;if(t>=1)return 1;
  return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI/3))+1;
}
function easeOutBack(t){const c=2.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}

function tick(ts){
  if(!last)last=ts;
  const dt=ts-last;last=ts;
  let ry,rx;
  if(trans&&tStart!==null){
    const p=Math.min((ts-tStart)/TDUR,1);
    ry=lerp(fY,tY,easeOutElastic(p));
    rx=lerp(fX,tX,easeOutBack(Math.min(p*1.2,1)));
    cY=ry;cX=rx;
    if(p>=1){trans=false;cY=tY;cX=tX;}
  } else {
    idleT+=dt*.001;
    ry=tY+Math.sin(idleT*.44)*swayAmp;
    rx=tX+Math.cos(idleT*.37)*(swayAmp*.4);
    cY=ry;cX=rx;
  }
  phone.style.transform=`rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg)`;
  requestAnimationFrame(tick);
}
function startJS(){if(jsRunning)return;jsRunning=true;requestAnimationFrame(tick);}
phone.addEventListener('animationend',startJS,{once:true});
setTimeout(startJS,1900);

// ── Carousel ───────────────────────────────────
const TOTAL=5;
const promos=[0,1,2,3,4].map(i=>document.getElementById('p'+i));
const scrns =[0,1,2,3,4].map(i=>document.getElementById('sc'+i));
const dots  =[0,1,2,3,4].map(i=>document.getElementById('d'+i));
// Each slide has its own entrance animation class
const anims =['a-l','a-z','a-r','a-f','a-d'];
let cur=0;

function goTo(next){
  const prev=cur;cur=next;

  // Hide previous
  scrns[prev].classList.remove('show');
  // Remove all anim classes so animation can re-trigger
  scrns[prev].classList.remove(...anims);

  setTimeout(()=>{
    // Force reflow so animation restarts
    void scrns[next].offsetWidth;
    scrns[next].classList.add('show', anims[next]);
  },200);

  // Promo text
  promos[prev].classList.remove('in');
  promos[prev].classList.add('out');
  setTimeout(()=>{promos[prev].classList.remove('out');promos[next].classList.add('in');},460);

  // Dots
  dots[prev].classList.remove('on');
  dots[next].classList.add('on');

  // Phone rotation
  fY=cY;fX=cX;
  tY=angles[next].y;tX=angles[next].x;
  trans=true;tStart=performance.now();last=performance.now();
}

setTimeout(()=>setInterval(()=>goTo((cur+1)%TOTAL),3000),2800);
</script>
</body>
</html>
